<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIF curator</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <style>
    /* Borrowed from the game's tokens, so a GIF is judged in the colours it will have
       on a card. */
    body { min-height: 100vh; }
    .curate { max-width: 1100px; margin: 0 auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 12px; }

    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand { font-family: var(--gn-font-display); font-size: 1.15rem; white-space: nowrap; }
    .brand small {
      display: block; font-family: var(--gn-font-body); font-size: .68rem;
      text-transform: uppercase; letter-spacing: var(--gn-track-label); color: var(--gn-ink-dim);
    }
    .tally { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .pill {
      display: inline-flex; flex-direction: column; gap: 3px; overflow: hidden;
      padding: 5px 11px 6px; border: var(--gn-outline-sm) solid var(--gn-outline-color);
      border-radius: var(--gn-radius-pill); background: var(--gn-bg-2);
      font-size: .78rem; font-weight: 800; white-space: nowrap;
    }
    .pill b { font-family: var(--gn-font-display); }
    .pill--normal { background: var(--gn-accent-3); color: var(--gn-accent-3-ink); }
    .pill--adult { background: var(--gn-accent-2); color: var(--gn-accent-2-ink); }
    .pill--millennial { background: var(--gn-accent-1); color: var(--gn-accent-1-ink); }
    .meter { display: block; width: 100%; height: 5px; border-radius: 3px; background: rgba(0,0,0,.24); overflow: hidden; }
    .meter i { display: block; height: 100%; background: currentColor; opacity: .8; }

    /* --- tabs: the library is the job, discovery is how you feed it ---------- */
    .tabs { display: flex; gap: 8px; border-bottom: var(--gn-outline-sm) solid var(--gn-outline-color); padding-bottom: 10px; }
    .tab {
      padding: 9px 18px; border: var(--gn-outline-sm) solid var(--gn-outline-color);
      border-radius: var(--gn-radius-pill); background: transparent; color: var(--gn-ink);
      font-family: var(--gn-font-display); font-size: .92rem; cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--gn-accent-4); color: var(--gn-accent-4-ink); }
    [hidden] { display: none !important; }

    /* --- shared: a GIF is shown whole, never cropped ------------------------ */
    /* Fixed width, natural height. Cards used to be forced into a 4:3 box with
       object-fit:cover, which sliced the top off anything tall and the sides off
       anything wide — and left the page's midnight blue showing through GIFs with a
       transparent background. Both problems go away by letting the picture set its
       own height and sitting it on white, which is what these were authored against. */
    .shot { display: block; width: 100%; height: auto; background: #fff; }

    /* --- library ------------------------------------------------------------ */
    .filters { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .filter {
      padding: 6px 13px; border: var(--gn-outline-sm) solid var(--gn-outline-color);
      border-radius: var(--gn-radius-pill); background: var(--gn-bg-3); color: var(--gn-ink);
      font-size: .8rem; font-weight: 800; cursor: pointer;
    }
    .filter[aria-pressed="true"] { background: var(--gn-accent-4); color: var(--gn-accent-4-ink); }
    .grid { columns: 3 220px; column-gap: 12px; }
    .item {
      break-inside: avoid; margin: 0 0 12px; position: relative; overflow: hidden;
      border: var(--gn-outline) solid var(--gn-outline-color); border-radius: var(--gn-radius-sm);
      background: var(--gn-bg-2); box-shadow: var(--gn-shadow);
    }
    .item--gone { opacity: .45; }
    .item__name {
      display: block; padding: 6px 9px; font-size: .74rem; font-weight: 800;
      color: var(--gn-ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item__sets { display: flex; gap: 5px; padding: 0 7px 8px; }
    .chipbtn {
      flex: 1 1 0; padding: 6px 0; border: var(--gn-outline-sm) solid var(--gn-ink-dim);
      border-radius: var(--gn-radius-pill); background: transparent; color: var(--gn-ink-dim);
      font-size: .72rem; font-weight: 800; cursor: pointer; text-align: center;
    }
    .chipbtn[aria-pressed="true"] { border-color: var(--gn-outline-color); }
    .chipbtn--normal[aria-pressed="true"] { background: var(--gn-accent-3); color: var(--gn-accent-3-ink); }
    .chipbtn--adult[aria-pressed="true"] { background: var(--gn-accent-2); color: var(--gn-accent-2-ink); }
    .chipbtn--millennial[aria-pressed="true"] { background: var(--gn-accent-1); color: var(--gn-accent-1-ink); }
    .item__drop {
      position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; display: grid;
      place-items: center; border: var(--gn-outline-sm) solid var(--gn-outline-color);
      border-radius: 50%; background: var(--gn-danger); color: var(--gn-danger-ink);
      font-size: .9rem; font-weight: 800; cursor: pointer; opacity: 0; transition: opacity 140ms ease;
    }
    .item:hover .item__drop, .item:focus-within .item__drop { opacity: 1; }
    .empty { padding: 40px 10px; text-align: center; color: var(--gn-ink-dim); }

    /* --- add by link -------------------------------------------------------- */
    .adder { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
    .adder textarea {
      flex: 1 1 320px; min-width: 0; min-height: 44px; padding: 11px 14px; resize: vertical;
      border: var(--gn-outline) solid var(--gn-outline-color); border-radius: var(--gn-radius-sm);
      background: var(--gn-surface); color: var(--gn-surface-ink);
      font-family: var(--gn-font-body); font-weight: 700; font-size: .9rem;
    }

    /* --- discover ----------------------------------------------------------- */
    .find { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .find input {
      flex: 1 1 220px; min-width: 0; padding: 10px 14px;
      border: var(--gn-outline) solid var(--gn-outline-color); border-radius: var(--gn-radius-pill);
      background: var(--gn-surface); color: var(--gn-surface-ink);
      font-family: var(--gn-font-body); font-weight: 800; font-size: 1rem;
    }



    .morewrap { display: flex; justify-content: center; padding: 6px 0 2px; }
    .hint { color: var(--gn-ink-dim); font-size: .8rem; }
    .flash {
      position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
      padding: 9px 16px; border: var(--gn-outline) solid var(--gn-outline-color);
      border-radius: var(--gn-radius-pill); background: var(--gn-surface); color: var(--gn-surface-ink);
      font-family: var(--gn-font-display); box-shadow: var(--gn-shadow);
      opacity: 0; transition: opacity 180ms ease; z-index: 60; pointer-events: none;
    }
    .flash--on { opacity: 1; }
    .flash--bad { background: var(--gn-danger); color: var(--gn-danger-ink); }
    .problem {
      padding: 10px 14px; border: var(--gn-outline) solid var(--gn-outline-color);
      border-radius: var(--gn-radius-sm); background: var(--gn-danger); color: var(--gn-danger-ink); font-weight: 800;
    }
    .problem:empty { display: none; }

    /* On a phone the tap targets have to be above the fold, so the trimmings get
       compressed rather than pushing the buttons off screen. */
    @media (max-width: 760px) {
      .curate { padding: 8px 12px 16px; gap: 7px; }
      .brand { font-size: 1rem; }
      .tally { gap: 5px; }
      .pill { font-size: .7rem; padding: 4px 9px 5px; }
      .grid { columns: 2 130px; column-gap: 8px; }
      .item { margin-bottom: 8px; }
      .item__drop { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="curate" id="curate">
    <div class="bar">
      <h1 class="brand">🃏 GIF curator
        <small>{{ source }} · rating {{ rating }}</small>
      </h1>
      <div class="tally" id="tally"></div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" id="tab-library" role="tab" aria-selected="true" data-tab="library" type="button">Library</button>
      <button class="tab" id="tab-discover" role="tab" aria-selected="false" data-tab="discover" type="button">Discover</button>
      <form method="post" action="{{ url_for('logout') }}" style="margin-left:auto">
        <button class="btn btn--tiny btn--ghost" type="submit">Sign out</button>
      </form>
    </div>

    <p class="problem" id="problem"></p>

    <!-- ============================ LIBRARY ============================ -->
    <section id="panel-library" role="tabpanel" aria-labelledby="tab-library">
      <div class="adder">
        <textarea id="links" placeholder="Paste GIF links — Tenor, Discord, anywhere. One per line, or comma separated."></textarea>
        <button class="btn" data-action="add-links" type="button">Add</button>
      </div>

      <div class="filters" id="filters"></div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>Nothing in this set yet — find some in <b>Discover</b>.</p>
    </section>

    <!-- =========================== DISCOVER ============================ -->
    <section id="panel-discover" role="tabpanel" aria-labelledby="tab-discover" hidden>
      <div class="find">
        <input id="search" type="search" placeholder="Search {{ source }} — type anything" autocomplete="off" spellcheck="false">
        <button class="btn" data-action="search" type="button">Search</button>
      </div>
      <p class="hint" id="found"></p>

      <div class="grid" id="results"></div>
      <p class="empty" id="noresults" hidden>Search for something to start tagging.</p>
      <div class="morewrap"><button class="btn btn--ghost" id="more" data-action="more" type="button" hidden>Show 50 more</button></div>
    </section>
  </main>

  <div class="flash" id="flash"></div>

<script>
(() => {
  'use strict';
  const SETS = {{ sets | tojson }};
  const SET_ORDER = {{ set_order | tojson }};   // Normal, 18+, Millennial — in that order
  const GIF_BASE = {{ url_for('static', filename='gifs/') | tojson }};
  // Absolute, not relative. Reached as /curate (no trailing slash) a relative "api/next"
  // resolves against the parent and lands on the *game*, which answers with HTML — so
  // every fetch went "Unexpected token '<'". url_for knows the prefix; nothing else does.
  const BASE = {{ url_for('index') | tojson }};
  const apiUrl = (path) => BASE.replace(/\/?$/, '/') + path;
  const el = (id) => document.getElementById(id);
  const tally = el('tally'), problem = el('problem'), flashEl = el('flash'), search = el('search');
  const grid = el('grid'), filters = el('filters'), emptyEl = el('empty');
  const resultsEl = el('results'), foundEl = el('found'), moreEl = el('more'), noResultsEl = el('noresults');

  let busy = false;
  let cards = [];        // the library
  let ignoredCards = []; // rejected, kept only so search can skip them
  let filter = 'all';
  let results = [];      // the current page of search results
  let term = '';         // what was searched for
  let offset = 0;

  const esc = (s) => String(s == null ? '' : s).replace(/[<>&"]/g, (c) =>
    ({'<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;'}[c]));

  function flash(text, bad) {
    flashEl.textContent = text;
    flashEl.classList.toggle('flash--bad', !!bad);
    flashEl.classList.add('flash--on');
    clearTimeout(flash.timer);
    flash.timer = setTimeout(() => flashEl.classList.remove('flash--on'), 1400);
  }

  function renderCounts(counts) {
    if (!counts) return;
    const meter = (n) => '<span class="meter"><i style="width:' +
      Math.min(100, Math.round(100 * n / counts.target)) + '%"></i></span>';
    tally.innerHTML = SET_ORDER.map((name) => {
      const n = counts.sets[name] || 0;
      return '<span class="pill pill--' + name + '">' + SETS[name].label.toLowerCase() +
        ' <b>' + n + '</b>/' + counts.target + meter(n) + '</span>';
    }).join('') + '<span class="pill">rejected <b>' + (counts.ignored || 0) + '</b></span>';
  }

  // --- tabs ---------------------------------------------------------------
  function showTab(which) {
    document.querySelectorAll('[data-tab]').forEach((b) =>
      b.setAttribute('aria-selected', b.dataset.tab === which ? 'true' : 'false'));
    el('panel-library').hidden = which !== 'library';
    el('panel-discover').hidden = which !== 'discover';
    if (which === 'discover') search.focus();
  }

  // --- one card, used by both grids ---------------------------------------
  /**
   * A tile: the GIF whole, its name, and the three set toggles.
   *
   * Library and Discover render the identical thing — the only differences are where
   * the picture comes from (a file we own vs. the source's preview) and that a library
   * card can be dropped from the game outright.
   */
  function cardHtml(c, kind) {
    const src = kind === 'library' ? GIF_BASE + encodeURIComponent(c.file) : c.preview;
    const attr = kind === 'library' ? 'data-card' : 'data-result';
    const dim = kind === 'library' ? !c.on_disk : (c.known && !c.sets.length);
    return '<figure class="item' + (dim ? ' item--gone' : '') + '" ' + attr + '="' + esc(c.source_id) + '">' +
      '<img class="shot" src="' + esc(src) + '" alt="' + esc(c.title) + '" loading="lazy">' +
      '<button class="item__drop" data-drop="' + esc(c.source_id) +
        '" title="Not funny — never offer it again" type="button">✕</button>' +
      '<figcaption class="item__name" title="' + esc(c.title) + '">' + esc(c.title || '(untitled)') + '</figcaption>' +
      '<div class="item__sets">' +
        SET_ORDER.map((n) =>
          '<button class="chipbtn chipbtn--' + n + '" data-' + (kind === 'library' ? 'card' : 'result') +
          '-set="' + esc(c.source_id) + '" data-set-name="' + n + '" aria-pressed="' +
          (c.sets.indexOf(n) !== -1) + '" type="button">' + SETS[n].label + '</button>').join('') +
      '</div>' +
    '</figure>';
  }

  // --- the library --------------------------------------------------------
  function drawFilters() {
    const counts = {all: cards.length, ignored: ignoredCards.length};
    SET_ORDER.forEach((n) => { counts[n] = cards.filter((c) => c.sets.indexOf(n) !== -1).length; });
    const one = (key, label) =>
      '<button class="filter" data-filter="' + key + '" aria-pressed="' + (filter === key) +
      '" type="button">' + label + ' <b>' + counts[key] + '</b></button>';
    filters.innerHTML = one('all', 'Everything') +
      SET_ORDER.map((n) => one(n, SETS[n].label)).join('') +
      one('ignored', 'Rejected');
  }

  function drawGrid() {
    if (filter === 'ignored') {
      // No pictures here: the file is gone the moment a card is rejected, and the point
      // of this view is only to undo a mistake.
      emptyEl.hidden = ignoredCards.length > 0;
      grid.innerHTML = ignoredCards.map((c) =>
        '<figure class="item"><figcaption class="item__name" title="' + esc(c.title) + '">' +
          esc(c.title) + '</figcaption>' +
        '<div class="item__sets"><button class="chipbtn" data-unignore="' + esc(c.source_id) +
          '" type="button">Un-reject</button></div></figure>').join('');
      return;
    }
    const shown = filter === 'all' ? cards : cards.filter((c) => c.sets.indexOf(filter) !== -1);
    emptyEl.hidden = shown.length > 0;
    grid.innerHTML = shown.map((c) => cardHtml(c, 'library')).join('');
  }

  async function loadLibrary() {
    const data = await (await fetch(apiUrl('api/library'))).json();
    cards = data.cards || [];
    ignoredCards = data.ignored || [];
    renderCounts(data.counts);
    drawFilters();
    drawGrid();
  }

  async function retag(sourceId, sets) {
    if (busy) return;
    busy = true;
    const card = cards.find((c) => c.source_id === sourceId);
    const before = card ? card.sets.slice() : [];
    if (card) card.sets = sets;      // optimistic — the grid responds instantly
    drawGrid();
    try {
      const response = await fetch(apiUrl('api/retag'), {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({source_id: sourceId, sets: sets}),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'save failed');
      if (!sets.length) cards = cards.filter((c) => c.source_id !== sourceId);
      else if (card) { card.sets = data.sets; card.on_disk = true; }
      renderCounts(data.counts);
      flash(sets.length ? 'In: ' + sets.map((s) => SETS[s].label).join(' + ') : 'Removed from the game');
    } catch (err) {
      if (card) card.sets = before;  // put it back if the server refused
      flash(String(err.message || err), true);
    } finally {
      busy = false;
      drawFilters();
      drawGrid();
    }
  }

  /** The ✕: out of the game, and search stops offering it. Undoable from "Rejected". */
  async function reject(sourceId) {
    if (busy) return;
    busy = true;
    const known = cards.find((c) => c.source_id === sourceId) ||
                  results.find((c) => c.source_id === sourceId) || {};
    cards = cards.filter((c) => c.source_id !== sourceId);
    results = results.filter((c) => c.source_id !== sourceId);
    drawFilters(); drawGrid(); drawResults();
    try {
      const response = await fetch(apiUrl('api/reject'), {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({source_id: sourceId, title: known.title, page: known.page}),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'could not reject that');
      renderCounts(data.counts);
      flash('Rejected — search will skip it');
    } catch (err) {
      flash(String(err.message || err), true);
    } finally {
      busy = false;
      loadLibrary();
    }
  }

  async function unignore(sourceId) {
    if (busy) return;
    busy = true;
    try {
      const response = await fetch(apiUrl('api/unignore'), {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({source_id: sourceId}),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'failed');
      renderCounts(data.counts);
      flash('Search will offer it again');
    } catch (err) {
      flash(String(err.message || err), true);
    } finally {
      busy = false;
      loadLibrary();
    }
  }

  async function addLinks() {
    const raw = el('links').value.split(/[\s,]+/).map((s) => s.trim()).filter(Boolean);
    if (!raw.length) { flash('Paste a link first', true); return; }
    flash('Fetching ' + raw.length + ' link(s)…');
    const data = await (await fetch(apiUrl('api/add-link'), {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({links: raw}),
    })).json();
    problem.textContent = (data.failed || []).map((f) => f.link + ' — ' + f.why).join('\n');
    if (data.candidates && data.candidates.length) {
      // Straight into Discover as results, so they can be tagged like anything else.
      results = data.candidates.concat(results);
      results.forEach((c) => { c.sets = c.sets || []; });
      el('links').value = '';
      term = '';
      showTab('discover');
      drawResults();
      foundEl.textContent = data.candidates.length + ' from your links — tag them below';
      flash('Yours — now tag with N / E / M');
    } else {
      flash('Nothing could be read from those', true);
    }
  }

  // --- discover: you search, it shows the results --------------------------
  function drawResults() {
    noResultsEl.hidden = results.length > 0;
    moreEl.hidden = results.length === 0;
    resultsEl.innerHTML = results.map((c) => cardHtml(c, 'result')).join('');
  }

  async function doSearch(more) {
    if (busy) return;
    busy = true;
    const wanted = more ? term : search.value.trim();
    offset = more ? offset + 50 : 0;
    foundEl.textContent = 'Searching…';
    try {
      const response = await fetch(apiUrl('api/search?q=') + encodeURIComponent(wanted) + '&offset=' + offset);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'search failed');
      term = wanted;
      problem.textContent = '';
      const found = data.results || [];
      results = more ? results.concat(found) : found;
      renderCounts(data.counts);
      drawResults();
      foundEl.textContent = results.length + (more ? ' results' : ' results') +
        (term ? ' for “' + term + '”' : ' — trending right now') +
        (found.length === 0 ? ' (nothing more)' : '');
      if (!more) window.scrollTo({top: 0, behavior: 'smooth'});
    } catch (err) {
      problem.textContent = String(err.message || err);
      foundEl.textContent = '';
    } finally {
      busy = false;
    }
  }

  /** Tag a search result. Unlike the library this may have to download the file, so the
   *  whole candidate goes to the server, not just its id. */
  async function tagResult(sourceId, sets) {
    const c = results.find((r) => r.source_id === sourceId);
    if (!c || busy) return;
    busy = true;
    const before = (c.sets || []).slice();
    c.sets = sets;               // optimistic, so the chips respond instantly
    drawResults();
    try {
      const response = await fetch(apiUrl('api/sets'), {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({candidate: c, sets: sets}),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'save failed');
      c.sets = data.sets;
      c.known = true;
      renderCounts(data.counts);
      flash(sets.length ? 'In: ' + sets.map((s) => SETS[s].label).join(' + ') : 'Removed');
      loadLibrary();             // so the Library tab already agrees when you switch
    } catch (err) {
      c.sets = before;           // put it back if the server refused
      flash(String(err.message || err), true);
    } finally {
      busy = false;
      drawResults();
    }
  }

  /** Flip one set on a card in either grid. */
  function toggled(current, name) {
    const sets = (current || []).slice();
    const at = sets.indexOf(name);
    if (at === -1) sets.push(name); else sets.splice(at, 1);
    return sets;
  }

  // --- input -------------------------------------------------------------
  document.addEventListener('click', (event) => {
    const hit = event.target.closest(
      '[data-action], [data-tab], [data-filter], [data-card-set], [data-result-set], [data-drop], [data-unignore]');
    if (!hit) return;
    if (hit.dataset.tab) return void showTab(hit.dataset.tab);
    if (hit.dataset.filter) { filter = hit.dataset.filter; drawFilters(); drawGrid(); return; }
    if (hit.dataset.drop) return void reject(hit.dataset.drop);
    if (hit.dataset.unignore) return void unignore(hit.dataset.unignore);
    if (hit.dataset.cardSet !== undefined && hit.dataset.setName) {
      const card = cards.find((c) => c.source_id === hit.dataset.cardSet);
      if (card) retag(card.source_id, toggled(card.sets, hit.dataset.setName));
      return;
    }
    if (hit.dataset.resultSet !== undefined && hit.dataset.setName) {
      const found = results.find((c) => c.source_id === hit.dataset.resultSet);
      if (found) tagResult(found.source_id, toggled(found.sets, hit.dataset.setName));
      return;
    }
    switch (hit.dataset.action) {
      case 'search': doSearch(false); break;
      case 'more': doSearch(true); break;
      case 'add-links': addLinks(); break;
    }
  });

  search.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') { event.preventDefault(); doSearch(false); search.blur(); }
  });

  renderCounts({{ counts | tojson }});
  loadLibrary();
})();
</script>
</body>
</html>
