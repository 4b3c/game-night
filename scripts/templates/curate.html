<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIF curator</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <style>
    /* Borrowed from the game's tokens, so a GIF is judged in the colours and at roughly
       the size it will have on a card. */
    body { min-height: 100vh; }
    .curate { max-width: 1000px; margin: 0 auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 12px; }

    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand { font-family: var(--gn-font-display); font-size: 1.15rem; white-space: nowrap; }
    .brand small {
      display: block; font-family: var(--gn-font-body); font-size: .68rem;
      text-transform: uppercase; letter-spacing: var(--gn-track-label); color: var(--gn-ink-dim);
    }
    .tally { display: flex; gap: 7px; flex-wrap: wrap; }
    .pill {
      display: inline-flex; flex-direction: column; gap: 3px; overflow: hidden;
      padding: 5px 11px 6px; border: var(--gn-outline-sm) solid var(--gn-outline-color);
      border-radius: var(--gn-radius-pill); background: var(--gn-bg-2);
      font-size: .78rem; font-weight: 800; white-space: nowrap;
    }
    .pill b { font-family: var(--gn-font-display); }
    .pill--normal { background: var(--gn-accent-3); color: var(--gn-accent-3-ink); }
    .pill--adult { background: var(--gn-accent-2); color: var(--gn-accent-2-ink); }
    .pill--millennial { background: var(--gn-accent-1); color: var(--gn-accent-1-ink); }
    .meter { display: block; width: 100%; height: 5px; border-radius: 3px; background: rgba(0,0,0,.24); overflow: hidden; }
    .meter i { display: block; height: 100%; background: currentColor; opacity: .8; }

    /* search + discovery */
    .find { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .find input {
      flex: 1 1 220px; min-width: 0; padding: 10px 14px;
      border: var(--gn-outline) solid var(--gn-outline-color); border-radius: var(--gn-radius-pill);
      background: var(--gn-surface); color: var(--gn-surface-ink);
      font-family: var(--gn-font-body); font-weight: 800; font-size: 1rem;
    }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag {
      padding: 5px 11px; border: var(--gn-outline-sm) solid var(--gn-outline-color);
      border-radius: var(--gn-radius-pill); background: var(--gn-bg-3); color: var(--gn-ink);
      font-size: .78rem; font-weight: 800; cursor: pointer;
    }
    .tag:hover { background: var(--gn-accent-4); color: var(--gn-accent-4-ink); }
    .tag--live { background: var(--gn-accent-4); color: var(--gn-accent-4-ink); }

    /* the GIF */
    .stage {
      position: relative; display: grid; place-items: center; min-height: 42vh; padding: 12px;
      border: var(--gn-outline-lg) solid var(--gn-outline-color); border-radius: var(--gn-radius);
      background: var(--gn-bg-well); box-shadow: var(--gn-shadow-lg); overflow: hidden;
    }
    .card {
      width: min(100%, 560px); aspect-ratio: 4 / 3; overflow: hidden;
      border: var(--gn-outline) solid var(--gn-outline-color); border-radius: var(--gn-radius-sm);
      background: #000; box-shadow: var(--gn-shadow);
    }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .stage--drop { outline: 4px dashed var(--gn-accent-3); outline-offset: -10px; }
    .meta { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; color: var(--gn-ink-dim); font-size: .85rem; min-height: 1.3em; margin-top: 8px; }
    .meta b { color: var(--gn-ink); }
    .meta .chip { padding: 2px 9px; border-radius: var(--gn-radius-pill); background: rgba(0,0,0,.3); font-size: .75rem; }
    .pos { font-variant-numeric: tabular-nums; }

    /* controls: one row on a desktop, two thumb-sized rows on a phone */
    .sets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 10px; }
    @media (min-width: 760px) {
      .controls { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: stretch; }
      .nav { display: contents; }
      .nav .navbtn:first-child { order: -1; }
      .sets { order: 0; }
    }
    .btn kbd { font-family: var(--gn-font-body); font-size: .66rem; font-weight: 800; opacity: .72; letter-spacing: .06em; }
    .verdict { flex-direction: column; gap: 2px; padding: 14px 8px; }
    /* Off = outline only, on = filled. A GIF can be in several sets at once. */
    .verdict[aria-pressed="false"] { background: transparent; color: var(--gn-ink); border-color: var(--gn-ink-dim); box-shadow: none; }
    .verdict[aria-pressed="true"]::before { content: '✓ '; }
    .v-normal[aria-pressed="true"] { background: var(--gn-accent-3); color: var(--gn-accent-3-ink); }
    .v-adult[aria-pressed="true"] { background: var(--gn-accent-2); color: var(--gn-accent-2-ink); }
    .v-millennial[aria-pressed="true"] { background: var(--gn-accent-1); color: var(--gn-accent-1-ink); }
    .navbtn { padding: 16px 18px; }

    .foot { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .hint { color: var(--gn-ink-dim); font-size: .8rem; }
    .flash {
      position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
      padding: 9px 16px; border: var(--gn-outline) solid var(--gn-outline-color);
      border-radius: var(--gn-radius-pill); background: var(--gn-surface); color: var(--gn-surface-ink);
      font-family: var(--gn-font-display); box-shadow: var(--gn-shadow);
      opacity: 0; transition: opacity 180ms ease; z-index: 60; pointer-events: none;
    }
    .flash--on { opacity: 1; }
    .flash--bad { background: var(--gn-danger); color: var(--gn-danger-ink); }
    .problem {
      padding: 10px 14px; border: var(--gn-outline) solid var(--gn-outline-color);
      border-radius: var(--gn-radius-sm); background: var(--gn-danger); color: var(--gn-danger-ink); font-weight: 800;
    }
    .problem:empty { display: none; }
    .preload { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    /* On a phone the tap targets have to be above the fold, so the trimmings get
       compressed rather than pushing the buttons off screen. */
    @media (max-width: 760px) {
      .curate { padding: 10px 12px 20px; gap: 9px; }
      .brand { font-size: 1rem; }
      .tally { gap: 5px; }
      .pill { font-size: .7rem; padding: 4px 9px 5px; }
      /* one swipeable row of starter terms instead of four stacked rows */
      .tags { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
      .tags::-webkit-scrollbar { display: none; }
      .tag { flex: 0 0 auto; }
      .stage { min-height: 30vh; padding: 8px; }
      .card { width: 100%; }
      .meta { font-size: .78rem; gap: 6px; margin-top: 6px; }
      .verdict { padding: 12px 4px; font-size: .95rem; }
      .navbtn { padding: 13px 12px; }
    }
  </style>
</head>
<body>
  <main class="curate" id="curate">
    <div class="bar">
      <h1 class="brand">🃏 GIF curator
        <small>{{ source }} · rating {{ rating }} · ≥{{ min_frames }} frames</small>
      </h1>
      <div class="tally" id="tally"></div>
    </div>

    <p class="problem" id="problem"></p>

    <div class="find">
      <input id="search" type="search" placeholder="Search anything — nuke, deep fried, cursed…" autocomplete="off" spellcheck="false">
      <button class="btn btn--tiny" data-action="search" type="button">Go</button>
      <button class="btn btn--tiny btn--ghost" data-action="shuffle" type="button">Whole pack</button>
      <button class="btn btn--tiny btn--ghost" data-action="related" type="button">Related to this <kbd>R</kbd></button>
    </div>
    <div class="tags" id="tags"></div>

    <section>
      <div class="stage" id="stage">
        <div class="card"><img id="gif" alt="candidate GIF"></div>
      </div>
      <p class="meta" id="meta"></p>
    </section>

    <section class="controls">
      <div class="sets">
        {% for name, meta in sets.items() %}
        <button class="btn verdict v-{{ name }}" data-set="{{ name }}" aria-pressed="false" type="button">
          {{ meta.label }} <kbd>{{ meta.key }}</kbd>
        </button>
        {% endfor %}
      </div>
      <div class="nav">
        <button class="btn navbtn btn--ghost" data-action="prev" type="button">← <kbd>Back</kbd></button>
        <button class="btn navbtn btn--go" data-action="next" type="button">Next → <kbd>→</kbd></button>
      </div>
    </section>

    <div class="foot">
      <button class="btn btn--tiny btn--ghost" data-action="clear" type="button">Remove from all sets <kbd>X</kbd></button>
      <label class="btn btn--tiny" for="pick">＋ Add your own GIFs
        <input id="pick" type="file" accept="image/gif,.gif" multiple hidden>
      </label>
      <span class="hint">or drag them onto the page · tagged GIFs go straight into the game</span>
      <button class="btn btn--tiny btn--danger" data-action="drop-filler" type="button">Delete the 80 placeholders</button>
    </div>

    <div id="preload" class="preload"></div>
  </main>

  <div class="flash" id="flash"></div>

<script>
(() => {
  'use strict';
  const SETS = {{ sets | tojson }};
  const STARTERS = {{ queries | tojson }};   // a few search terms to get going
  const el = (id) => document.getElementById(id);
  const gif = el('gif'), meta = el('meta'), tally = el('tally'), problem = el('problem');
  const flashEl = el('flash'), preload = el('preload'), tags = el('tags'), search = el('search');

  let history = [];      // everything shown this session, in order
  let index = -1;        // where we are in it
  let liveQuery = null;  // pinned search term, if any
  let relatedTags = [];
  let busy = false;

  function flash(text, bad) {
    flashEl.textContent = text;
    flashEl.classList.toggle('flash--bad', !!bad);
    flashEl.classList.add('flash--on');
    clearTimeout(flash.timer);
    flash.timer = setTimeout(() => flashEl.classList.remove('flash--on'), 1000);
  }

  function renderCounts(counts) {
    if (!counts) return;
    const meter = (n) => '<span class="meter"><i style="width:' +
      Math.min(100, Math.round(100 * n / counts.target)) + '%"></i></span>';
    tally.innerHTML = Object.keys(SETS).map((name) => {
      const n = counts.sets[name] || 0;
      return '<span class="pill pill--' + name + '">' + SETS[name].label.toLowerCase() +
        ' <b>' + n + '</b>/' + counts.target + meter(n) + '</span>';
    }).join('') + '<span class="pill">seen <b>' + counts.seen + '</b></span>';
  }

  function current() { return history[index] || null; }

  function paint() {
    const c = current();
    document.querySelectorAll('[data-set]').forEach((b) => {
      const on = !!c && (c.sets || []).indexOf(b.dataset.set) !== -1;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    if (!c) {
      gif.removeAttribute('src');
      meta.innerHTML = '<b>Nothing queued.</b> Try a search, or check the error above.';
      return;
    }
    if (gif.getAttribute('src') !== c.preview) gif.src = c.preview;
    meta.innerHTML =
      '<b>' + (c.title || '(untitled)').replace(/[<>&]/g, '') + '</b>' +
      '<span class="chip">' + (c.local ? 'your file' : 'found under “' + String(c.query).replace(/[<>&]/g, '') + '”') + '</span>' +
      (c.frames ? '<span class="chip">' + c.frames + ' frames</span>' : '') +
      '<span class="chip pos">' + (index + 1) + ' / ' + history.length + '</span>';
    // keep the next few warm so scrolling is instant
    preload.innerHTML = history.slice(index + 1, index + 4)
      .map((n) => '<img src="' + n.preview + '" alt="">').join('');
  }

  async function fill(n) {
    const response = await fetch('/api/next?n=' + (n || 6));
    const data = await response.json();
    renderCounts(data.counts);
    problem.textContent = data.error || '';
    liveQuery = data.query;
    history = history.concat(data.candidates || []);
    return (data.candidates || []).length;
  }

  async function go(step) {
    const leaving = current();
    if (step > 0 && index + 3 >= history.length) {
      try { await fill(6); } catch (e) { problem.textContent = String(e); }
    }
    const target = index + step;
    if (target < 0) { flash('Start of the list'); return; }
    if (target >= history.length) { flash('Nothing more yet — try again'); return; }
    index = target;
    paint();
    // Scrolling past something counts as having seen it, so it won't come round again
    // tomorrow. Tagged ones are remembered anyway.
    if (step > 0 && leaving && !(leaving.sets || []).length) {
      fetch('/api/seen', {method: 'POST', headers: {'Content-Type': 'application/json'},
                          body: JSON.stringify({candidate: leaving})}).catch(() => {});
    }
  }

  async function toggle(setName) {
    const c = current();
    if (!c || busy) return;
    busy = true;
    const before = (c.sets || []).slice();
    const sets = before.slice();
    const at = sets.indexOf(setName);
    if (at === -1) sets.push(setName); else sets.splice(at, 1);
    c.sets = sets;              // optimistic, so the buttons respond instantly
    paint();
    try {
      const response = await fetch('/api/sets', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({candidate: c, sets: sets}),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'save failed');
      c.sets = data.sets;
      renderCounts(data.counts);
      flash(sets.length ? 'In: ' + sets.map((s) => SETS[s].label).join(' + ') : 'Removed');
    } catch (err) {
      c.sets = before;           // put it back if the server refused
      flash(String(err.message || err), true);
    } finally {
      busy = false;
      paint();
    }
  }

  async function clearSets() {
    const c = current();
    if (!c) return;
    for (const s of (c.sets || []).slice()) await toggle(s);
  }

  async function pin(query) {
    await fetch('/api/query', {method: 'POST', headers: {'Content-Type': 'application/json'},
                              body: JSON.stringify({query: query})});
    liveQuery = query || null;
    search.value = query || '';
    const added = await fill(6);
    if (added) { index = history.length - added; paint(); }
    else { flash('No results for that', true); }
    drawTags();
  }

  function drawTags() {
    const chips = (relatedTags.length ? relatedTags : STARTERS).map((t) =>
      '<button class="tag' + (t === liveQuery ? ' tag--live' : '') + '" data-tag="' + t.replace(/"/g, '') + '" type="button">' + t + '</button>');
    tags.innerHTML = (liveQuery
      ? '<button class="tag tag--live" data-tag="" type="button">✕ ' + liveQuery + '</button>'
      : '') + chips.join('');
  }

  async function showRelated() {
    const c = current();
    if (!c) { flash('Nothing to go on', true); return; }
    const term = (c.query && c.query !== 'trending' && !c.local) ? c.query : '';
    const url = '/api/related?term=' + encodeURIComponent(term) + '&title=' + encodeURIComponent(c.title || '');
    const data = await (await fetch(url)).json();
    relatedTags = (data.tags && data.tags.length) ? data.tags : (data.fallback || []);
    drawTags();
    flash(relatedTags.length
      ? (data.tags.length ? 'Related to “' + data.term + '”' : 'Try these words')
      : 'Nothing to suggest for that one', !relatedTags.length);
  }

  async function post(path, okText) {
    const response = await fetch(path, {method: 'POST'});
    const data = await response.json();
    if (!response.ok) { flash(data.error || 'failed', true); return; }
    renderCounts(data.counts);
    flash(okText.replace('%n', data.removed));
  }

  // --- input -------------------------------------------------------------
  document.addEventListener('click', (event) => {
    const hit = event.target.closest('[data-set], [data-action], [data-tag]');
    if (!hit) return;
    if (hit.dataset.set) return void toggle(hit.dataset.set);
    if (hit.dataset.tag !== undefined) return void pin(hit.dataset.tag);
    switch (hit.dataset.action) {
      case 'next': go(1); break;
      case 'prev': go(-1); break;
      case 'clear': clearSets(); break;
      case 'search': pin(search.value.trim()); break;
      case 'shuffle': pin(''); break;
      case 'related': showRelated(); break;
      case 'drop-filler': post('/api/drop-filler', 'Deleted %n placeholders'); break;
    }
  });

  search.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') { event.preventDefault(); pin(search.value.trim()); search.blur(); }
    event.stopPropagation();
  });

  document.addEventListener('keydown', (event) => {
    if (event.target === search) return;
    const key = event.key.toLowerCase();
    if (key === 'arrowright') { event.preventDefault(); go(1); }
    else if (key === 'arrowleft') { event.preventDefault(); go(-1); }
    else if (key === 'n') { event.preventDefault(); toggle('normal'); }
    else if (key === 'e') { event.preventDefault(); toggle('adult'); }
    else if (key === 'm') { event.preventDefault(); toggle('millennial'); }
    else if (key === 'x') { event.preventDefault(); clearSets(); }
    else if (key === 'r') { event.preventDefault(); showRelated(); }
    else if (key === '/') { event.preventDefault(); search.focus(); search.select(); }
  });

  // --- drag in your own --------------------------------------------------
  const stage = el('stage');
  ['dragenter', 'dragover'].forEach((type) => document.addEventListener(type, (event) => {
    event.preventDefault();
    stage.classList.add('stage--drop');
  }));
  document.addEventListener('dragleave', (event) => {
    if (!event.relatedTarget) stage.classList.remove('stage--drop');
  });
  async function upload(files) {
    if (!files.length) return;
    const form = new FormData();
    files.forEach((file) => form.append('files', file));
    flash('Reading ' + files.length + ' file(s)…');
    const data = await (await fetch('/api/import', {method: 'POST', body: form})).json();
    renderCounts(data.counts);
    if (data.skipped && data.skipped.length) flash('Skipped (not .gif): ' + data.skipped.join(', '), true);
    if (data.candidates && data.candidates.length) {
      // Slot them in right after where we are, so they can be tagged straight away.
      history.splice(index + 1, 0, ...data.candidates);
      go(1);
      flash('Yours — now tag it with N / E / M');
    }
  }

  document.addEventListener('drop', (event) => {
    event.preventDefault();
    stage.classList.remove('stage--drop');
    upload(Array.from((event.dataTransfer && event.dataTransfer.files) || []));
  });
  el('pick').addEventListener('change', (event) => {
    upload(Array.from(event.target.files || []));
    event.target.value = '';   // so picking the same file twice still fires
  });

  renderCounts({{ counts | tojson }});
  drawTags();   // starter terms are visible immediately, so there's always somewhere to go
  (async () => { await fill(6); index = 0; paint(); })();
})();
</script>
</body>
</html>
